<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avalie seu filme aqui | CineTech</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Camadas do parallax, da mais distante à mais próxima -->
    <div class="parallax" aria-hidden="true">
      <div class="camada camada-1"></div>
      <div class="camada camada-2"></div>
      <div class="camada camada-3"></div>
      <div class="camada camada-4"></div>
      <div class="camada camada-5"></div>
      <div class="camada camada-6"></div>
    </div>

    <header class="site-header">
      <h1>CineTech</h1>
      <p>Avalie seu filme favorito</p>

      <div class="search-bar">
        <input
          type="text"
          id="inputFilme"
          placeholder="Digite o nome do filme em inglês..."
        />
        <button id="btnBuscar" type="button">Buscar</button>
      </div>
    </header>

    <main>
      <section id="movie-container" class="movie-container">
        <p>Faça uma busca para ver os resultados.</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
